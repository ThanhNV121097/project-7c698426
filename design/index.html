<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hello-word-8</title>
  <style>
    :root {
      color-scheme: light;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 6rem);
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <main aria-label="Hello Word display">
    <h1>Hello Word</h1>
  </main>
</body>
</html>
